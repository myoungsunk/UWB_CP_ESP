name: Mode8 operational integration
on:
  push:
    branches:
      - 'codex/mode8-operational-integration-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/operational
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/provenance/calibration_stage6_temporary.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Operational protocol and adverse-path tests
        run: python -m unittest discover -s UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/operational/tests -p 'test_*.py' -v
      - name: P2 fresh retry and recorded transaction 24 replay
        run: |
          python -m pip install numpy==2.2.4 pyserial==3.5
          python UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat/tools/test_operational_p2_fresh_retry.py -v
      - name: Tag PLL calibration and clock-history regression
        run: |
          cd UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat
          python -m unittest discover -s tests -p 'test_pll_calibration.py' -v
          mkdir -p build/host
          g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fno-pie -no-pie -fsanitize=address,undefined -Ishared tests/test_clock_history.cpp -o build/host/test_clock_history
          build/host/test_clock_history
      - name: Verify original Mode 8 shared-header snapshots
        run: |
          python UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat/tools/sync_shared.py --check
          python UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat/tools/sync_shared.py --check
      - name: Portable C++ Mode 8 regression (without Arduino/Wi-Fi host stubs)
        run: |
          cd UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat
          mkdir -p build/host evidence/host
          g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fno-pie -no-pie             -fsanitize=address,undefined -Ishared tests/test_core.cpp -o build/host/test_core
          build/host/test_core evidence/host
          g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fno-pie -no-pie -fsanitize=address,undefined -Ishared tests/test_transport_guard.cpp -o build/host/test_transport_guard
          build/host/test_transport_guard
          g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -Wno-unused-function -fno-pie -no-pie -fsanitize=address,undefined -Ishared tests/test_operational_anchor.cpp -o build/host/test_operational_anchor
          build/host/test_operational_anchor
          for role in 0 1; do
            g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fno-pie -no-pie -fsanitize=address,undefined -DDUAL8_ANCHOR=$role -Ishared tests/test_operational_profile.cpp -o build/host/test_operational_profile_$role
            build/host/test_operational_profile_$role
          done
      - name: Full firmware-tool regression with role-specific synthetic evidence
        run: |
          package=UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware
          (cd "$package/anchor_p2_repeat" && python -m unittest discover -s tests -p 'test_*.py' -v)
          cd "$package/tag_p2_repeat"
          mkdir -p build/host evidence/host
          g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fno-pie -no-pie \
            -fsanitize=address,undefined -Ishared tests/test_core.cpp -o build/host/test_core
          build/host/test_core evidence/host
          python -m unittest discover -s tests -p 'test_*.py' -v

  esp32-build:
    runs-on: ubuntu-latest
    needs: host-adversarial
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
      - name: Exact ESP32 core 3.3.7
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile operational anchor with original pinned DW1000 library
        run: |
          cd UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat
          python tools/build.py --role anchor || { tail -150 dist/anchor/compile.log; exit 2; }
      - name: Compile dual-DW1000 P1 drain tag
        run: |
          cd UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat
          python tools/build.py --role tag || { tail -150 dist/tag/compile.log; exit 2; }
      - name: Publish build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode8-operational-build-receipts
          path: |
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat/dist/target_build_receipt.json
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat/dist/anchor/compile.log
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat/dist/anchor/*.bin
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/anchor_p2_repeat/dist/anchor/*.elf
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat/dist/target_build_receipt.json
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat/dist/tag/compile.log
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat/dist/tag/*.bin
            UWB_MODE8_STAGE6_P2_REPEAT_HANDOFF_20261112/firmware/tag_p2_repeat/dist/tag/*.elf
          if-no-files-found: warn
